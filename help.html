<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help Centre · Alio</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--text:#14181f;--muted:#5d6678;--line:rgba(20,24,31,.12);--accent:#0071e3;--hover:rgba(0,113,227,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0b101a;--surface:#131a28;--text:#e8ecf5;--muted:#9aa5bb;--line:rgba(232,236,245,.14);--accent:#4aa3ff;--hover:rgba(74,163,255,.1)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:820px;margin:0 auto;padding:18px clamp(16px,4vw,28px) 70px}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;font:600 14px inherit;cursor:pointer}
h1{font-size:clamp(1.8rem,5vw,2.5rem);margin:22px 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px}
.search{position:relative;margin:0 0 6px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding:14px 16px 14px 44px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
.search input:focus-visible,.back:focus-visible,.topic:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{color:var(--muted);font-size:.95rem;margin:16px 0 8px}
.topics{margin:10px 0 0;border-top:1px solid var(--line)}
.topic{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px 8px;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;cursor:pointer}
.topic:hover{background:var(--hover)}
.topic .ic{font-size:30px;width:40px;text-align:center;flex:none}
.topic .tx{flex:1;min-width:0}
.topic b{display:block;font-size:1.08rem}
.topic small{display:block;color:var(--muted);font-size:.92rem}
.topic .ch{color:var(--muted);font-size:1.4rem}
.view-h{display:flex;align-items:center;gap:12px;margin:20px 0 4px}
.view-h .ic{font-size:34px}
.view-h h2{margin:0;font-size:1.5rem;letter-spacing:-.01em}
.view-d{color:var(--muted);margin:0 0 16px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 8px}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted);font-weight:400;margin-left:10px}
details[open] summary::after{content:"\2212"}
.ans{padding:0 16px 14px;color:var(--muted)}
.ans p{margin:0 0 .6em}.ans a{color:var(--accent)}
.where{display:block;font-weight:400;font-size:.8rem;color:var(--accent);margin-bottom:2px}
.count{color:var(--muted);font-size:.9rem;margin:14px 0 10px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:4px}
.foot{margin:34px 0 0;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.95rem}
.foot b{color:var(--text)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html" id="backLink">&larr; Back to Alio</a>
  <h1>Alio Help Centre</h1>
  <p class="sub">Your guide to getting more out of Alio.</p>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search questions or problems" aria-label="Search Help Centre" autocomplete="off" enterkeyhint="search">
  </div>

  <div id="home">
    <p class="intro" id="intro"></p>
    <div class="topics" id="topics"></div>
  </div>

  <div id="topicView" hidden>
    <button type="button" class="back" id="allTopics" style="margin-top:16px">&larr; All topics</button>
    <div class="view-h"><span class="ic" id="tIc"></span><h2 id="tTitle"></h2></div>
    <p class="view-d" id="tDesc"></p>
    <div id="tItems"></div>
  </div>

  <div id="results" hidden>
    <p class="count" id="rCount" aria-live="polite"></p>
    <div id="rItems"></div>
  </div>

  <div class="empty" id="empty" hidden><b>Help content is coming soon.</b>Check back shortly.</div>
  <div class="foot" id="foot" hidden><b>Can't find your answer?</b><br><span id="footText"></span></div>
</div>
<script src="help-content.js"></script>
<script>
(function(){
  var D=window.ALIO_HELP||{}, cats=Array.isArray(D.categories)?D.categories:[];
  function $(i){return document.getElementById(i)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  /* answers come from help-content.js (owner-written); still strip anything that could run script */
  function clean(h){var t=document.createElement('template');t.innerHTML=String(h||'');
    t.content.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(function(n){n.remove()});
    t.content.querySelectorAll('*').forEach(function(n){[].slice.call(n.attributes).forEach(function(a){
      if(/^on/i.test(a.name)||(/^(href|src)$/i.test(a.name)&&/^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name)})});
    var d=document.createElement('div');d.appendChild(t.content);return d.innerHTML}
  function answer(a){var h=clean(a);return /<(p|ul|ol|div)[\s>]/i.test(h)?h:'<p>'+h+'</p>'}
  function plain(h){var d=document.createElement('div');d.innerHTML=clean(h);return d.textContent||''}
  function qa(it,cat,showCat){
    return '<details id="'+esc(it.id)+'"><summary>'+(showCat?'<span class="where">'+esc(cat.icon+' '+cat.title)+'</span>':'')+esc(it.q)+'</summary><div class="ans">'+answer(it.a)+'</div></details>'}
  var index=[]; cats.forEach(function(c){(c.items||[]).forEach(function(it){index.push({c:c,it:it,s:(it.q+' '+plain(it.a)+' '+c.title).toLowerCase()})})});

  function show(which){['home','topicView','results'].forEach(function(id){$(id).hidden=(id!==which)});window.scrollTo(0,0)}
  function topicList(){
    $('topics').innerHTML=cats.map(function(c){
      return '<button type="button" class="topic" data-c="'+esc(c.id)+'"><span class="ic" aria-hidden="true">'+esc(c.icon||'📘')+'</span><span class="tx"><b>'+esc(c.title)+'</b><small>'+esc(c.description||'')+'</small></span><span class="ch" aria-hidden="true">›</span></button>'}).join('');
  }
  function openTopic(id,qid,push){
    var c=cats.filter(function(x){return x.id===id})[0]; if(!c){goHome(push);return}
    $('q').value='';
    $('tIc').textContent=c.icon||''; $('tTitle').textContent=c.title; $('tDesc').textContent=c.description||'';
    $('tItems').innerHTML=(c.items||[]).map(function(it){return qa(it,c,false)}).join('');
    show('topicView'); document.title=c.title+' · Alio Help Centre';
    if(push) history.pushState(null,'','#'+(qid||id));
    if(qid){var el=$(qid); if(el){el.open=true; el.scrollIntoView()}}
  }
  function goHome(push){
    $('q').value=''; show('home'); document.title='Help Centre · Alio';
    if(push&&location.hash) history.pushState(null,'',location.pathname+location.search);
  }
  function search(){
    var t=$('q').value.trim().toLowerCase();
    if(!t){ route(false); return }
    var words=t.split(/\s+/);
    var hits=index.filter(function(x){return words.every(function(w){return x.s.indexOf(w)>-1})});
    /* questions that match in the title come first */
    hits.sort(function(a,b){return (b.it.q.toLowerCase().indexOf(t)>-1)-(a.it.q.toLowerCase().indexOf(t)>-1)});
    show('results'); window.scrollTo(0,0);
    $('rCount').textContent=hits.length?(hits.length+(hits.length===1?' answer':' answers')+' for “'+$('q').value.trim()+'”'):'';
    $('rItems').innerHTML=hits.length?hits.slice(0,60).map(function(x){return qa(x.it,x.c,true)}).join(''):'<div class="empty"><b>No matches</b>Try different words, or browse the topics.</div>';
  }
  /* routing by hash: #notes opens a topic, #q23 opens one answer (also the future in-app "?" buttons) */
  function route(push){
    var h=decodeURIComponent((location.hash||'').slice(1));
    if(!h){goHome(false);return}
    var c=cats.filter(function(x){return x.id===h})[0];
    if(c){openTopic(h,null,false);return}
    var hit=index.filter(function(x){return x.it.id===h})[0];
    if(hit){openTopic(hit.c.id,h,false);return}
    goHome(false);
  }
  if(!cats.length){ $('home').hidden=true; $('empty').hidden=false; $('q').parentNode.hidden=true; return }
  $('intro').textContent=D.intro||''; topicList();
  if(D.outro){ $('footText').textContent=D.outro; $('foot').hidden=false }
  $('topics').addEventListener('click',function(e){var b=e.target.closest('.topic');if(b) openTopic(b.getAttribute('data-c'),null,true)});
  $('allTopics').addEventListener('click',function(){goHome(true)});
  $('q').addEventListener('input',search);
  window.addEventListener('hashchange',function(){ if(!$('q').value.trim()) route(false) });
  window.addEventListener('popstate',function(){ if(!$('q').value.trim()) route(false) });
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}
    else if(e.key==='Escape'&&$('q').value){$('q').value='';route(false)}
  });
  route(false);
})();
</script>
</body>
</html>
